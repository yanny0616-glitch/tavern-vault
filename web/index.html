<!doctype html>
<html lang="zh-CN" data-skin="atelier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="藏馆">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>酒馆藏馆</title>
<script>
  // 首屏前先确定风格与明暗，避免闪烁
  (function () {
    var d = document.documentElement, mode = 'auto', skin = '', p = {};
    try { p = JSON.parse(localStorage.getItem('tv_prefs') || '{}') || {}; mode = p.mode || 'auto'; skin = localStorage.getItem('tv_skin') || ''; } catch (e) {}
    var fs = Number(p.uiFont) || { xs: 13, sm: 14, md: 15, lg: 16 }[p.uiSize] || (Math.min(screen.width, screen.height) < 600 ? 14 : 15);
    d.style.setProperty('--fs', String(Math.min(24, Math.max(11, fs)) / 15));
    if (mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.dataset.mode = mode;
    if (skin) d.dataset.skin = skin;
  })();
</script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/skins.css">
</head>
<body>
<div id="app">
  <div class="boot"><svg class="boot-logo" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg><div>藏馆加载中</div></div>
</div>
<div id="toasts"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
