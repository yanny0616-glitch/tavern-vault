# 编译 iOS App（未签名 IPA，用 AltStore / SideStore / Sideloadly 等自签安装）
# 手动运行：Actions → iOS App → Run workflow；打 app-v1.2.3 这样的 tag 会同时发布到 Releases
name: iOS App

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/ios-app.yml']
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 版本号
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then v="${GITHUB_REF#refs/tags/app-v}"; else v="$(node -p "require('./package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本 $v（构建号 $GITHUB_RUN_NUMBER）"

      - name: 安装依赖
        run: npm ci

      - name: 生成 iOS 工程
        run: |
          npx cap add ios
          bash scripts/patch-ios.sh
          npx cap sync ios

      - name: 编译（不签名）
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION='${{ steps.ver.outputs.version }}' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|BUILD FAILED|failed" build.log | head -60; tail -n 30 build.log; exit 1; }
          tail -n 5 build.log

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "TavernVault-${{ steps.ver.outputs.version }}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TavernVault-${{ steps.ver.outputs.version }}-ipa
          path: app/*.ipa
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.ipa --title "藏馆 iOS App ${{ steps.ver.outputs.version }}" \
            --notes "未签名 IPA，请用 AltStore / SideStore / Sideloadly 等工具自签后安装。"
